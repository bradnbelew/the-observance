# ============================================================================
#  The Observance — sites.yml  (config-driven world placements)
# ----------------------------------------------------------------------------
#  Named marker/site entries with PLACEHOLDER coordinates. Fill these in AFTER
#  the world seed is chosen. The plugin treats any site with `enabled: false`
#  OR placeholder coords (the literal sentinel below) as "not yet sited" and
#  silently skips it — it never errors at players over an unplaced site.
#
#  A "site" is a named location the engine can:
#    - protect (markers resist being broken / are restored)
#    - target beats at (sounds/particles/reveals near it)
#    - detect proximity / custom-compliance against (e.g. The Bow marker, a cairn)
#
#  Coordinate sentinel: x/y/z = null  → treated as UNPLACED.
# ============================================================================

# Default world that bare site entries belong to (override per-site with `world:`).
default-world: "world"

# Global marker behavior defaults (each site may override).
defaults:
  radius: 6              # blocks; proximity / compliance radius around the site
  protect: true          # marker blocks at this site resist being broken / restored
  vertical-radius: 4     # +/- Y tolerance for proximity checks (caves/cliffs)

sites:
  # --- Custom-compliance anchors (DESIGN §2.4 / arc custom table) ------------

  bow_marker_01:
    type: "bow_marker"           # The Bow — crouch near marker (PlayerToggleSneakEvent)
    world: "world"
    x: null                      # PLACEHOLDER — set after world seed
    y: null
    z: null
    radius: 6
    protect: true
    enabled: true

  offering_cairn_01:
    type: "offering_cairn"       # The Offering — first-ore drop at the cairn
    world: "world"
    x: null
    y: null
    z: null
    radius: 5
    protect: true
    enabled: true

  kept_light_home_01:
    type: "kept_light"           # The Kept Light — one fire must burn at home
    world: "world"
    x: null
    y: null
    z: null
    radius: 12                   # base-scale radius
    protect: false               # this is a scan zone, not a protected marker
    enabled: true

  # --- Report / lore anchors (Archivist lecterns) ---------------------------

  first_report_lectern_01:
    type: "report_lectern"       # where the first report appears (Movement I)
    world: "world"
    x: null
    y: null
    z: null
    radius: 4
    protect: true
    enabled: true

  # --- Answer-sign sites (THE IN-WORLD ANSWER VERB / the closed clue loop) ---
  #  A player submits a clue answer by EDITING a sign within one of these sites'
  #  radius. The AnswerSignListener reads the typed lines, normalizes them (the
  #  exact ORACLE.md §2 algorithm — identical to the Discord surface), and matches
  #  against the OPEN `puzzles` rows. On a genuinely-new solve it records the solve
  #  and enqueues the authored reward beat (status 'approved' → fires next poll);
  #  on a miss the sign simply blanks, no error, no hint.
  #
  #  Site types treated as answer slots: `answer_sign` (preferred) and `keeper_stone`.
  #  Optional `puzzle-key:` BINDS a site to ONE puzzle (a focused gate). OMIT it (the
  #  default) for the non-linear web — the sign then resolves against ALL open puzzles,
  #  so any clue a group has solved can be answered at any keeper-stone.

  answer_sign_01:
    type: "answer_sign"
    world: "world"
    x: null                      # PLACEHOLDER — set after world seed
    y: null
    z: null
    radius: 3                    # tight: the sign must be AT the stone
    vertical-radius: 3
    protect: true                # the answer-sign block itself is restored if broken
    enabled: true
    # puzzle-key: "clue_caesar_1a2b3c4d"   # OPTIONAL — bind to one puzzle; omit = match all open

  # --- Reserved expedition slots (Movement II keeper-stones — Phase 1+) ------
  #  Left here, disabled, so the schema is stable for later agents to fill. These
  #  are ALSO valid answer-submission sites (type keeper_stone) once placed/enabled.

  keeper_stone_01:
    type: "keeper_stone"
    world: "world"
    x: null
    y: null
    z: null
    radius: 8
    protect: true
    enabled: false
    # puzzle-key: null           # OPTIONAL binding; omit for the non-linear web

  keeper_stone_02:
    type: "keeper_stone"
    world: "world"
    x: null
    y: null
    z: null
    radius: 8
    protect: true
    enabled: false

  # ==========================================================================
