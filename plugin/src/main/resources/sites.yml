    # only post `iss_caught` + `seventh_named` — they are distinct PLACES, temporally layered, one anchor.
    # The merged `divergent-fates` INHERITORS deposit lands here too (one `seventh_choice` flag, no
    # separate `dark_shrine` site — that idea was merged out, never carry a `dark_shrine` entry).

  # ==========================================================================
  #  THE SEVENTH + THE DEEP HOLD BACK-HALF (INTEGRATION-V2 A1/A5/A6/A7/A8/A9 +
  #  BUILD-MANIFEST §6). Named, ENABLED placeholders so every new seed `site_id`
