  # ==========================================================================
  #  THE TWO DEEPENING LANES — the Nether (deep fire-source) + the End (exile /
  #  the Seventh's absence). INTEGRATION-V2 A15 / BUILD-MANIFEST §6 / WORLD-BIBLE §12.
  #  These sit in SEPARATE worlds (`observance_nether` / `observance_end` — the
  #  Multiverse pattern, like the Undercroft void world). `LocationSampler` already
  #  keys proximity/heatmap on `worldName`, so a cross-dimension site needs ZERO new
  #  tracking infra — `Site.contains` is the dimension-presence signal. Both lanes
  #  GATE NOTHING (INV-12) and are NOT in the Accepting quorum (INV-19).
  #
  #  GO-LIVE / world-coverage note (siteCoverageSelfTest extension, R7): a cross-
  #  dimension row (nether-forge / end-seventh-out in progression_seed.sql) must NOT
  #  seed OPEN unless its site here is placed + enabled IN THE NAMED WORLD — i.e. the
  #  Multiverse world `observance_nether` / `observance_end` must EXIST first. Coords
  #  null = UNPLACED until the dimension worlds are built; the plugin SILENTLY skips an
  #  unplaced site, never errors at a player.
  # ==========================================================================

  # --- The Nether lane (observance_nether) ----------------------------------

  # The Nether forge / near pocket — the deep fire-source made walkable ("below the below"). A short
  # ruined room just past a lit portal (a DELVE, not a trek; the walk-budget is 2 ground walks + <=1
  # short vertical pocket, S4) holding a prior keeper's remains on a deepslate slab + the decaying
  # journal (the-fire-kept-me) + a doused soul-lantern. The on-site WORD (INV-14 — never the coordinate)
  # is read off the slab and answered at the slab, setting `nether_forge_found` + bonus Whisper budget +
  # the Kept-Light origin (the keeping was always a carrying). The keeper-remains is PLACED AT WORLD-BUILD,
  # never pasted toward an approaching player (reveal-safe). Type `answer_sign` so the AnswerSignListener
  # reads the on-site word at the slab (the closed clue loop). BLOCKED on the FACT-11 source-clause seal
  # (BUILD-MANIFEST §0.12 / S11) before any build; enabled here so the seed site_id resolves.
  nether_forge:
    type: "answer_sign"            # the on-site word is submitted at the slab (INV-14 destination word)
    world: "observance_nether"
    x: null
    y: null
    z: null
    radius: 5
    vertical-radius: 4
    protect: true
    enabled: true
    # puzzle-key: "nether-forge"    # OPTIONAL bind to the on-site row; omit = match all open (the web)

  # The soul gallery — soul sand / soul fire as the not-kept of DEEP TIME (failed communities older than
  # the first keeper; FACT 12 from the souls' side — DISTINCT from the present-tense Pale herd, S5). A
  # texture/atmosphere anchor only: it carries the `nether.soulSand` Set-B record line near it and the
  # soul-fire ambient. NOT an answer slot, NOT a protected build — the soul sand IS the lore, nothing is
  # built where the vanilla block suffices. A wide occlusion zone the group crosses to reach the pocket.
  soul_gallery:
    type: "marker"
    world: "observance_nether"
    x: null
    y: null
    z: null
    radius: 14                     # gallery-scale: a wide field of soul sand crossed on the way in
    protect: false                 # the souls are the ground; nothing to protect
    enabled: true

  # The bastion remains — the founders' deepest ruined delvings (NOT piglin architecture in-fiction; the
  # works of the first keepers who went furthest toward the fire and did not come back human-scaled — the
  # deepest "deeper = more wrong-scaled," structures.md). Texture/atmosphere anchor only: a discovered-
  # never-witnessed wrong-scaled ruin the group reads on the way to the pocket. The P2 intimate Nether
  # glimpse (basalt-corridor keeper-shape) may fire near here, re-skinned + DEFERRING to apparitionClaim
  # (INV-18) — the Nether has no apparition lane of its own. NOT an answer slot.
  bastion_remains:
    type: "structure"
    world: "observance_nether"
    x: null
    y: null
    z: null
    radius: 12
    protect: false                 # vanilla bastion re-read in-fiction; additive dressing only, no overwrite
    enabled: true

  # --- The End lane (observance_end) ----------------------------------------

  # The End Seventh-shrine — the Seventh's home OUTSIDE the record (no kept fire, no markers, no count).
  # Carried by a re-dressed end-ship (reveal-safe: force-load -> mutate on unwitnessed relog -> unload) OR
  # a world-build PRE-GENERATED outer island — NEVER a lazy paste toward an approaching glider (S6). Built
  # to the Seventh's unfinished, wrong-scaled hand (the `the_unwriting` signature). It carries the End-shrine
  # carving (the-name-i-cut-myself); reaching it + answering its on-site read sets `seventh_seen_out` (a
  # group-scoped flag, NOT a fate input — S2). Type `answer_sign` for the on-site read (the closed clue loop;
  # the WORD answers, INV-14). ZERO ambient apparition lane here (the End is outside the record — a positive
  # canon choice, S6/R3). Producer rule (S7): additive pastes onto verified-clear ADJACENT AIR (a deepslate
  # carving-slab beside the vanilla blocks) or RevealBeat flips — NEVER an occupied overwrite, NEVER RoomSwapBeat.
  end_seventh_shrine:
    type: "answer_sign"            # the on-site read is answered at the carving-slab (INV-14)
    world: "observance_end"
    x: null
    y: null
    z: null
    radius: 6
    vertical-radius: 6             # an end-ship / island shrine: looser Y tolerance over the void
    protect: true
    enabled: true
    # puzzle-key: "end-seventh-out"  # OPTIONAL bind to the arrival row; omit = match all open

  # The End exile-hold — the `cast_out` divergent fate made a PLACE (a re-dressed end-city, markers all
  # facing AWAY; canon-spine §8.4 made literal and vast). P2/cuttable. enabled:FALSE until the INV-16-bound
  # binding is BUILT (S10, non-negotiable): the hold must name NO living player and encode NO per-player side
  # — chorus-only dressing ("you only came to look"), never the LEFT_AT set, no dressing spatially
  # corresponding to any per-player carve. If the open End cannot guarantee that, this stays disabled and the
  # End ships as the Seventh shrine ALONE (the default). Discovered-never-witnessed static set-piece only.
  end_exile_hold:
    type: "structure"
    world: "observance_end"
    x: null
    y: null
    z: null
    radius: 18                     # a vast exile-hold over the open End; markers face away
    protect: true
    enabled: false                 # GATED: stays off until the INV-16 binding is built (S10), else cut

