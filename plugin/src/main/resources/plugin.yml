name: Observance
version: '0.5.0'
main: com.observance.watcher.ObservancePlugin
api-version: '1.21'
author: Voxaris
description: The Observance V5 production ARG runtime for Paper 1.21.11.
load: POSTWORLD

# Citizens is optional: Wren and townsfolk fall back to persistent PDC-tagged armor stands.
softdepend: [Citizens]

commands:
  observance:
    description: Operate and verify The Observance V5 runtime.
    aliases: [obs]
    permission: observance.admin
    usage: |
      /obs status
      /obs preflight
      /obs audit | visualaudit | dialogueaudit
      /obs placehold <prepare|plan|build|audit|sync|repair|seal|open>
      /obs unlit <candidate|buildmode|site|clue|repair|border|darken|audit|ready>
      /obs townsfolk <spawn|despawn> [id]
      /obs wren <spawn|despawn>
      /obs item recover <artifact> [player]
      /obs finale <status|markers|arm [15-600 seconds]|cancel>
      /obs sleep <on|off> | reload | runbook
  observancelink:
    description: Issue a short-lived code proving control of your online Minecraft identity.
    aliases: [obslink]
    permission: observance.link
    usage: /obslink
  observancefinding:
    description: Submit or replay short structured campaign findings without chat parsing.
    aliases: [obsfinding]
    permission: observance.arg.finding
    usage: /obsfinding <help|status|replay|p6-recovery|p8|p9-people|p9-window>
  observancem3:
    description: Operate the disposable private M3 Paper review slice.
    aliases: [obsm3]
    permission: observance.admin
    usage: /obsm3 <status|build|audit|observe|draft|lodge-report|lodge-synthesis|naive-negative|brute-negative|report-correct|synthesis-correct|replay|security|watcher-approve|watcher-show>
  observancefile:
    description: Use the examiner's findings ledger in an armed disposable M3 review target.
    aliases: [obsfile]
    permission: observance.m3.file
    usage: /obsfile <open|mark|lodge|seal>

permissions:
  observance.admin:
    description: Allows V5 setup, audit, recovery, and finale operations.
    default: op
  observance.link:
    description: Allows a player to request their own one-time Discord identity proof.
    default: true
  observance.m3.file:
    description: Allows in-world use of the fail-closed disposable M3 findings ledger.
    default: true
  observance.arg.case:
    description: Allows the disposable P4/P5 ARG investigation and recovery input surface.
    default: true
  observance.arg.finding:
    description: Allows the stable local campaign finding and recovery surface.
    default: true
  observance.unlit.copy:
    description: Allows the bounded Unlit copy register and its keyboard recovery surface.
    default: true
