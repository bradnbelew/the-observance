# The Observance V5 production runtime (Paper 1.21.11).
# Narrative, puzzle predicates, books, NPC dialogue, and finale text are packaged V5 authorities;
# this file contains operations only. Never put a service-role key in Git.

supabase:
  url: "https://fdnmhbpxnodrnbrzrlqq.supabase.co/rest/v1"
  service-key-env: "OBSERVANCE_SUPABASE_KEY"
  service-key: ""
  connect-timeout-ms: 5000
  read-timeout-ms: 8000
  max-retries: 2
  retry-backoff-ms: 750
  offline-queue-max: 500

# V4 remote beat enactment is disabled in V5 code. These bounded values remain for the transport
# object and make an accidental legacy activation quiet rather than theatrical.
beat-queue:
  poll-interval-seconds: 60
  max-per-poll: 1

samplers:
  location-sample-seconds: 20
  heatmap-cell-size: 16
  base-detect-seconds: 300
  inventory-scan-seconds: 120
  presence-heartbeat-seconds: 60

# The ambient Watcher. V5 runs only the curated, per-player, text-free sensory palette (sound,
# particle, darkness, dim, private time-shift, and the name-on-wall signature) plus the hint toll —
# see V5SafeBeatEnactor / AmbientBeatGenerator. Cadence is felt but restrained: the Attention gate
# keeps calm, grouped moments quiet and draws the Watcher toward the lonely/deep/dark player. These
# defaults give roughly one considered beat every several minutes, heavily skewed to tense moments.
drama:
  enabled: true
  personalized-cooldown-minutes: 20
  personalized-max-per-session: 3
  ambient-cooldown-minutes: 20
  ambient-global-cooldown-minutes: 3
  window-minutes: 30
  window-max-beats: 5
  personalized-confidence-min: 1.0

tracker:
  enabled: false
  answer-sign:
    cooldown-seconds: 3

tier0:
  enabled: false

rate-limit:
  oracle-cooldown-seconds: 5
  oracle-burst: 3
  oracle-refill-seconds: 30

unlit:
  enabled: true
  copy-proof:
    # Console exercise exists only for disposable Paper automation. Player builds leave this false.
    disposable-audit-enabled: false
  world: "observance_unlit"
  buildmode: false
  force-night: true
  night-time: 18000
  disable-regular-mob-spawns: true
  light-budget: 3
  light-radius: 6
  light-lifetime-seconds: 150
  authored-light-threshold: 8
  safe-darkness-effect-seconds: 4
  safe-darkness-effect-amplifier: 0
  darkness-effect-seconds: 7
  darkness-effect-amplifier: 1
  darkness-grace-seconds: 8
  darkness-damage-seconds: 22
  darkness-damage: 1.0
  figure-cooldown-seconds: 18
  figure-visible-ticks: 64
  figure-swoop-chance: 0.45
  figure-swoop-damage: 0.5
  border-radius: 138

protection:
  restore-broken-markers: true
  restore-delay-ticks: 1
  cancel-protected-breaks: true

reveal:
  witness-radius: 64
  retry-delay-ticks: 40
  retry-max-attempts: 10

resource-pack:
  url: "https://fdnmhbpxnodrnbrzrlqq.supabase.co/storage/v1/object/public/observance-public/observance-resourcepack.zip"
  sha1: "bae2623687b8d9e68eb4910807ed87d03671ca3c"
  required: true
  prompt: "The Record uses an authored alphabet and soundscape. Accept the pack to enter."
  delay-ticks: 20

# Revealed only after the in-world Surface Dispatch filing (LS06).
# Keep this current before each release; preflight fails closed when it is blank or malformed.
handoff:
  discord-invite-url: "https://discord.gg/z3HTfGvEA3"

# The schema-2 finale persists COMMITTED/CODA before theater. In production it then saves, kicks,
# and requests a real Paper shutdown. Set false only in an isolated rehearsal server.
finale:
  production-shutdown: true

# Retired V4 closing beat fail-safe. RP05/RP06 exclusively own the V5 ending.
closing:
  enabled: false
  theater-seconds: 0
  whitelist-after: false

logging:
  debug: false

# Private M3 review mode is deliberately inert in every normal installation. The disposable
# Paper harness writes a matching target marker before enabling it; the plugin refuses all M3
# world mutation without both values. Never enable this on Crafty or a player-facing server.
m3-review:
  enabled: false
  target-id: ""
  world: "m3_private_slice"
  origin-x: 0
  origin-y: 80
  origin-z: 0
  source-git-commit: ""
  arg-experience:
    enabled: false
    dialog-enabled: true
