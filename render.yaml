services:
  - type: worker
    name: observance-discord
    runtime: node
    rootDir: discord
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    envVars: &observanceEnv
      - key: NODE_VERSION
        value: "22"
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: CHANNEL_THE_RECORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DISCORD_VOICE_CHANNEL_ID
        sync: false
      - key: WHISPER_API_URL
        sync: false
      - key: WHISPER_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-1
      - key: WHISPER_LANG
        value: en

  - type: cron
    name: observance-showrunner
    runtime: node
    rootDir: discord
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: npm run showrunner
    envVars: *observanceEnv
