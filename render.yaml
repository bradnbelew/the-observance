services:
  - type: worker
    name: observance-discord
    runtime: node
    rootDir: discord
    buildCommand: npm ci
    startCommand: npm start
    autoDeployTrigger: commit
    envVars: &observanceEnv
      - key: NODE_VERSION
        value: "22"
      - key: OBSERVANCE_CAMPAIGN_VERSION
        value: v5
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_APP_ID
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: CHANNEL_THE_RECORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SHOWRUNNER_TICK_MS
        value: "12000"
      - key: SHOWRUNNER_LEASE_SECONDS
        value: "300"

  - type: cron
    name: observance-showrunner
    runtime: node
    rootDir: discord
    schedule: "*/5 * * * *"
    buildCommand: npm ci
    startCommand: npm run showrunner
    envVars: *observanceEnv
