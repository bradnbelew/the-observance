name: mrrw
version: '2.0.0'
main: com.copperline.mrrw.MrrwPlugin
api-version: '1.21'
author: Copperline Recovery
description: Mossfield recovery process (Morrow v2 ARG runtime).
commands:
  mrrw:
    description: Operator control for the Morrow campaign.
    permission: mrrw.operator
    usage: "/mrrw install | act <1-10> [started-ISO] | status | dawn | replay [sound] | reload | stop <code>"
permissions:
  mrrw.operator:
    default: op
