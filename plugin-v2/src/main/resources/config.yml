# mrrw configuration

# Must equal the website's MORROW_STOP_SECRET. Signs the Act 10 stop code.
stop-secret: mrrw-dev-stop-secret

# Acts advance by themselves from what the game and the website already log (see
# morrow/v2/OPERATOR-RUNBOOK.md). /mrrw act N always wins. Ops don't count as residents for the
# join / online-time triggers unless auto_advance_count_ops is true.
auto_advance: true
auto_advance_count_ops: false

# The signed bridge the website and the Discord bot read (GET /state, POST /event, GET /corpus).
# Requests are signed with stop-secret; every request is refused while it is the dev default.
# Changing these needs a server restart.
bridge:
  enabled: true
  bind: 0.0.0.0
  port: 25588

# Signed skin textures for the replayed figures (see morrow/v2/HUMAN-TODO.md, "Skins").
# Generated from morrow/v2/skins/*.png at mineskin.org (unlisted). To change one, re-upload
# the PNG and paste the new value and signature. Empty = default skin; figures still work.
skins:
  rookery:
    value: ""
    signature: ""
  cairn:
    value: ""
    signature: ""
  finchline:
    value: ""
    signature: ""
  juni_lantern:
    value: ""
    signature: ""
  patchcord:
    value: ""
    signature: ""
  kitbag:
    value: ""
    signature: ""
  i_bell:
    value: ""
    signature: ""
  lowpath:
    value: ""
    signature: ""
