<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1100" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">The Observance V5 compact Deep Hold blueprint</title>
  <desc id="desc">A three-level schematic of the compact one-mouth Hold: Orientation and the shared Keeper archive, the civic library and service works, then the lower spine, side investigations, and Release.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#294047" stroke-width="1" opacity=".35"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#91c6ca"/>
    </marker>
    <style>
      .bg{fill:#071116}.frame{fill:#0b191e;stroke:#38565f;stroke-width:2}.grid{fill:url(#grid)}
      .upper{fill:#132b31;stroke:#6c9aa1;stroke-width:2}.civic{fill:#192d29;stroke:#83a58c;stroke-width:2}.lower{fill:#28251f;stroke:#b5a06e;stroke-width:2}.finale{fill:#252139;stroke:#9388c7;stroke-width:2}
      .inner{fill:#0e1e23;stroke:#55747b;stroke-width:1.5}.route{fill:none;stroke:#91c6ca;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#668991;stroke-width:5;stroke-linecap:round}.gate{stroke:#dfb86d;stroke-width:6}.shelf{stroke:#8bb293;stroke-width:8;stroke-dasharray:7 5}
      .title{font:700 31px Georgia,serif;fill:#e6eff0;letter-spacing:3px}.subtitle{font:400 15px system-ui,sans-serif;fill:#96afb5;letter-spacing:1.8px}
      .level{font:700 20px system-ui,sans-serif;fill:#e6eff0;letter-spacing:2px}.label{font:600 15px system-ui,sans-serif;fill:#dce9eb;text-anchor:middle}.minor{font:400 12px system-ui,sans-serif;fill:#9bb4b9;text-anchor:middle}
      .coord{font:400 11px ui-monospace,monospace;fill:#78979e}.gate-label{font:700 12px system-ui,sans-serif;fill:#f0d19a}.legend{font:500 13px system-ui,sans-serif;fill:#c2d2d5}.note{font:500 14px system-ui,sans-serif;fill:#dbe8ea}
    </style>
  </defs>

  <rect width="1800" height="1100" class="bg"/>
  <rect x="35" y="35" width="1730" height="1030" rx="18" class="frame"/>
  <text x="80" y="90" class="title">DEEP HOLD / V5 COMPACT BUILD</text>
  <text x="82" y="122" class="subtitle">ONE PUBLIC MOUTH / 12 SHARED SPACES / 76 AUTHORED FIXTURES / 8 CONTROLLED THRESHOLDS</text>
  <text x="1455" y="86" class="coord">local footprint X -76..76</text>
  <text x="1455" y="106" class="coord">local footprint Z -6..233</text>
  <text x="1455" y="126" class="coord">canonical direction +Z</text>

  <g transform="translate(70 165)">
    <rect width="520" height="790" rx="14" class="frame grid"/>
    <text x="24" y="40" class="level">UPPER ARCHIVE / Y -40</text>
    <text x="24" y="62" class="coord">Orientation + one Keeper hall / X -62..62 / Z 106..210</text>

    <path d="M260 86V168" class="route"/>
    <ellipse cx="260" cy="92" rx="46" ry="30" class="upper"/>
    <text x="260" y="88" class="label">MOUTH</text><text x="260" y="106" class="minor">only entrance</text>
    <rect x="120" y="174" width="280" height="88" rx="9" class="upper"/>
    <text x="260" y="208" class="label">ORIENTATION REGISTRY</text>
    <text x="260" y="229" class="minor">first records / covered copy / callback 9137</text>
    <line x1="215" y1="276" x2="305" y2="276" class="gate"/><text x="318" y="280" class="gate-label">G1</text>

    <rect x="45" y="296" width="430" height="310" rx="12" class="upper"/>
    <rect x="200" y="316" width="120" height="270" rx="8" class="inner"/>
    <text x="260" y="347" class="label">KEEPER ARCHIVE</text>
    <text x="260" y="368" class="minor">one visible shared work floor</text>
    <g>
      <rect x="62" y="326" width="118" height="66" rx="7" class="inner"/><text x="121" y="355" class="label">VAUN</text><text x="121" y="375" class="minor">stores</text>
      <rect x="340" y="326" width="118" height="66" rx="7" class="inner"/><text x="399" y="355" class="label">MARA</text><text x="399" y="375" class="minor">five books</text>
      <rect x="62" y="415" width="118" height="66" rx="7" class="inner"/><text x="121" y="444" class="label">ISS</text><text x="121" y="464" class="minor">heat office</text>
      <rect x="340" y="415" width="118" height="66" rx="7" class="inner"/><text x="399" y="444" class="label">SELLA</text><text x="399" y="464" class="minor">school / shore</text>
      <rect x="62" y="504" width="118" height="66" rx="7" class="inner"/><text x="121" y="533" class="label">BRANN</text><text x="121" y="553" class="minor">watch</text>
      <rect x="340" y="504" width="118" height="66" rx="7" class="inner"/><text x="399" y="533" class="label">ORIN</text><text x="399" y="553" class="minor">six dials</text>
    </g>
    <path d="M180 359H200M320 359H340M180 448H200M320 448H340M180 537H200M320 537H340" class="branch"/>
    <line x1="215" y1="620" x2="305" y2="620" class="gate"/><text x="318" y="624" class="gate-label">G2</text>
    <path d="M260 638C198 650 198 680 260 692C322 704 322 734 260 746" class="route"/>
    <text x="260" y="770" class="minor">two-flight staff stair / reversible</text>
  </g>

  <g transform="translate(640 165)">
    <rect width="520" height="790" rx="14" class="frame grid"/>
    <text x="24" y="40" class="level">CIVIC LIBRARY / Y -68</text>
    <text x="24" y="62" class="coord">Open evidence floor + Service Works / X -66..66 / Z 10..208</text>

    <path d="M260 84V126" class="route"/>
    <rect x="34" y="126" width="452" height="390" rx="12" class="civic"/>
    <line x1="72" y1="158" x2="72" y2="485" class="shelf"/>
    <line x1="448" y1="158" x2="448" y2="485" class="shelf"/>
    <path d="M260 144V494" class="route"/>
    <text x="260" y="170" class="label">ONE CIVIC LIBRARY</text>
    <text x="260" y="192" class="minor">central reading floor / two evidence streets / loops rejoin</text>
    <text x="142" y="242" class="label">WEST STREET</text>
    <text x="142" y="266" class="minor">school / markers</text><text x="142" y="286" class="minor">cistern / watch</text><text x="142" y="306" class="minor">edited shelf / far water</text>
    <text x="378" y="242" class="label">EAST STREET</text>
    <text x="378" y="266" class="minor">market / rations</text><text x="378" y="286" class="minor">break files / warmth</text><text x="378" y="306" class="minor">filter stores / coops</text>
    <rect x="120" y="346" width="280" height="108" rx="8" class="inner"/>
    <text x="260" y="384" class="label">ACTIVE RECORD FLOOR</text>
    <text x="260" y="407" class="minor">lecterns / shelves / cases / ordinary work evidence</text>
    <text x="260" y="429" class="minor">no freestanding puzzle-room props</text>

    <line x1="215" y1="536" x2="305" y2="536" class="gate"/><text x="318" y="540" class="gate-label">G3</text>
    <rect x="105" y="560" width="310" height="104" rx="10" class="civic"/>
    <text x="260" y="600" class="label">SERVICE WORKS</text>
    <text x="260" y="623" class="minor">restoration controls / practical light / lower descent</text>
    <path d="M260 664C198 676 198 706 260 718C322 730 322 752 260 766" class="route"/>
  </g>

  <g transform="translate(1210 165)">
    <rect width="520" height="790" rx="14" class="frame grid"/>
    <text x="24" y="40" class="level">LOWER HOLD / Y -96</text>
    <text x="24" y="62" class="coord">Shared spine + two side investigations / X -76..70 / Z 10..233</text>

    <path d="M260 84V142" class="route"/>
    <rect x="118" y="142" width="284" height="84" rx="9" class="lower"/>
    <text x="260" y="174" class="label">LOWER WORKROOM</text><text x="260" y="197" class="minor">reckoning / Deep Access Plate / return landing</text>
    <line x1="215" y1="244" x2="305" y2="244" class="gate"/><text x="318" y="248" class="gate-label">G4</text>

    <rect x="200" y="266" width="120" height="222" rx="9" class="lower"/>
    <text x="260" y="296" class="label">LOWER SPINE</text>
    <rect x="20" y="286" width="160" height="182" rx="10" class="lower"/>
    <text x="100" y="320" class="label">PRIOR CASE</text><text x="100" y="341" class="minor">location proof</text>
    <line x1="52" y1="364" x2="148" y2="364" class="gate"/><text x="100" y="387" class="gate-label" text-anchor="middle">PRIOR</text>
    <text x="100" y="418" class="label">ASH-13 CAMP</text><text x="100" y="440" class="minor">notebook / barrels / spool</text>
    <rect x="340" y="286" width="160" height="182" rx="10" class="lower"/>
    <text x="420" y="320" class="label">THRESHOLD</text><text x="420" y="341" class="minor">Wren / relay</text>
    <line x1="372" y1="364" x2="468" y2="364" class="gate"/><text x="420" y="387" class="gate-label" text-anchor="middle">DREAD</text>
    <text x="420" y="418" class="label">DREAD FILE</text><text x="420" y="440" class="minor">bounded required evidence</text>
    <path d="M180 377H200M320 377H340" class="branch"/>

    <line x1="215" y1="510" x2="305" y2="510" class="gate"/><text x="318" y="514" class="gate-label">G5</text>
    <rect x="105" y="534" width="310" height="74" rx="9" class="finale"/>
    <text x="260" y="565" class="label">ACCEPTING / AVERYN</text><text x="260" y="586" class="minor">six affidavits / A V E R Y N / conduct record</text>
    <line x1="215" y1="628" x2="305" y2="628" class="gate"/><text x="318" y="632" class="gate-label">G6</text>
    <rect x="88" y="650" width="344" height="62" rx="9" class="finale"/>
    <text x="260" y="687" class="label">UNWRITING</text>
    <path d="M260 712V728" class="route"/>
    <rect x="118" y="728" width="284" height="48" rx="9" class="finale"/>
    <text x="260" y="758" class="label">RELEASE / SEVER RECORD</text>
  </g>

  <g transform="translate(80 995)">
    <rect x="0" y="0" width="18" height="18" class="upper"/><text x="28" y="14" class="legend">registry / Keepers</text>
    <rect x="190" y="0" width="18" height="18" class="civic"/><text x="218" y="14" class="legend">library / service</text>
    <rect x="370" y="0" width="18" height="18" class="lower"/><text x="398" y="14" class="legend">lower work / branches</text>
    <rect x="590" y="0" width="18" height="18" class="finale"/><text x="618" y="14" class="legend">Averyn / Release</text>
    <line x1="790" y1="9" x2="850" y2="9" class="gate"/><text x="866" y="14" class="legend">persistent gate</text>
    <path d="M1035 9H1100" class="route"/><text x="1116" y="14" class="legend">two-way route after opening</text>
    <text x="1480" y="14" class="coord">old outer wings are backfilled during same-Mouth replacement</text>
  </g>
  <text x="80" y="1050" class="note">Every fixture, book mount, container, gate and finale control remains runtime-owned and is audited after the shell is complete.</text>
</svg>
